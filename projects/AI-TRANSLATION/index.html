<!DOCTYPE html>
<html>
<head>
    <title>Audio Translation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        nav {
            background-color: #333;
            width: 100%;
            padding: 1rem 0;
            text-align: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }
        h1 {
            margin-top: 2rem;
        }
        form {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
            max-width: 400px;
        }
        label {
            font-weight: bold;
            margin-bottom: -0.5rem;
        }
        input[type="file"], input[type="text"] {
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
            width: 100%;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
    
    <h1>Upload an audio file</h1>
    
    <form method="post" enctype="multipart/form-data">
        <label>Audio File:</label>
        <input type="file" name="file" accept="audio/*" required>
        
        <label>Target Language:</label>
        <input type="text" name="language" placeholder="e.g., 'English', 'Hindi', etc." required>
        
        <button type="submit">Translate Audio</button>
    </form>
</body>
</html>
